<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAiQ — Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css?v=24">
</head>
<body>
    <div class="app-background"></div>

    <nav class="top-nav">
        <div class="nav-left">
            <div class="logo">TAiQ</div>
            <div class="nav-links" id="nav-links"></div>
        </div>
        <div class="nav-right">
            <img src="/assets/cnk_logo.png" alt="CNK Logo" class="cnk-logo" onerror="this.style.display='none'">
            <div id="nav-user-area"></div>
        </div>
    </nav>

    <div class="main-layout">
        <div class="page-title-bar">
            <div>
                <h1 class="page-h1">Dashboard</h1>
                <p class="page-sub">Monitor your tender processing and system activity</p>
            </div>
            <div>
                <span class="page-date-chip" id="selected-date-label">Today's overview</span>
            </div>
        </div>

        <!-- TAiQ status widget -->
        <div class="dash-taiq-card" id="dash-taiq-card">
            <div class="dtc-left">
                <span class="dtc-dot dtc-dot-idle" id="dtc-dot"></span>
                <span class="dtc-robot">🤖</span>
                <div class="dtc-text">
                    <strong>TAiQ Work</strong>
                    <span id="dtc-desc">Checking…</span>
                </div>
            </div>
            <div class="dtc-right">
                <div class="dtc-pills" id="dtc-pills"></div>
                <a href="/taiq-work" class="dtc-view-btn">View Details →</a>
            </div>
        </div>

        <!-- Last 3 days report cards -->
        <div class="daily-report-row" id="daily-report-row"></div>

        <!-- Stats row -->
        <div class="stats-row" id="stats-row"></div>

        <!-- Summary sentence -->
        <p class="dash-summary-sentence" id="dash-summary"></p>

        <!-- Main split -->
        <div class="dash-grid">
            <!-- Calendar + glance -->
            <div class="calendar-panel">
                <!-- Date Filter Preset Chips -->
                <div class="cal-presets-row" id="cal-presets-row">
                    <button class="cal-preset-chip active" data-preset="today">Today</button>
                    <button class="cal-preset-chip" data-preset="yesterday">Yesterday</button>
                    <button class="cal-preset-chip" data-preset="7days">Last 7 Days</button>
                    <button class="cal-preset-chip" data-preset="30days">Last 30 Days</button>
                    <button class="cal-preset-chip" data-preset="custom">Custom Range</button>
                </div>
                <!-- Custom Date Range Inputs Box -->
                <div class="cal-custom-box" id="cal-custom-box" style="display: none;">
                    <div class="cal-custom-inputs">
                        <label>From: <input type="date" id="cal-from-date" class="cal-date-input"></label>
                        <label>To: <input type="date" id="cal-to-date" class="cal-date-input"></label>
                    </div>
                    <div class="cal-custom-hint">Click Start & End dates on calendar or pick dates above</div>
                    <button class="cal-preset-chip active mt-1" id="cal-apply-custom">Apply Range</button>
                </div>
                <div class="calendar-header">
                    <button class="cal-nav-btn" id="cal-prev">&#8592;</button>
                    <span class="cal-month-label" id="cal-month-label"></span>
                    <button class="cal-nav-btn" id="cal-next">&#8594;</button>
                </div>
                <div class="cal-weekdays">
                    <span>Mo</span><span>Tu</span><span>We</span>
                    <span>Th</span><span>Fr</span><span>Sa</span><span>Su</span>
                </div>
                <div class="cal-grid" id="cal-grid"></div>
                <div id="side-breakdown-panel"></div>
            </div>

            <!-- Content -->
            <div class="dash-content">
                <!-- User activity -->
                <div class="dash-section" id="run-activity-section">
                    <div class="dash-section-header">
                        <h2>Run Activity</h2>
                    </div>
                    <div class="table-wrap" id="activity-wrap">
                        <p class="empty-msg">No runs on this date.</p>
                    </div>
                </div>

                <!-- Filters -->
                <div class="dash-section">
                    <div class="dash-section-header">
                        <h2>Tenders Found</h2>
                        <div class="filter-row">
                            <select id="filter-site" class="filter-select">
                                <option value="">All Sites</option>
                            </select>
                            <span class="filter-search">
                                <input type="text" id="filter-keyword" class="filter-input"
                                       placeholder="Search keywords…">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" aria-hidden="true">
                                    <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                                </svg>
                            </span>
                            <button class="secondary-btn filter-btn" id="apply-filter">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                     aria-hidden="true">
                                    <path d="M3 5h18l-7 8v6l-4 2v-8Z"/>
                                </svg>Filter
                            </button>
                        </div>
                    </div>
                    <div id="tenders-grid">
                        <p class="empty-msg">No tenders found for this date.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Tender Inspection Modal -->
    <div class="td-modal-overlay" id="td-modal-overlay" style="display: none;">
        <div class="td-modal-card">
            <div class="td-modal-header">
                <div class="td-modal-title-area">
                    <span class="td-modal-icon">📄</span>
                    <div>
                        <h3 id="td-modal-title">Tender Title</h3>
                        <div class="td-modal-meta-pills" id="td-modal-meta-pills"></div>
                    </div>
                </div>
                <button class="td-modal-close" id="td-modal-close">&times;</button>
            </div>
            <div class="td-modal-body" id="td-modal-body"></div>
        </div>
    </div>

    <script src="/static/auth.js"></script>
    <script src="/static/nav.js"></script>
    <script src="/static/dashboard.js?v=4"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
