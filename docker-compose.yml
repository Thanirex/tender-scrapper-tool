services:
  taiq:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - taiq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  taiq-data:
