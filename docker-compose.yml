services:
  taiq:
    build: .
    # Run a tiny init as PID 1. Without it uvicorn is PID 1 and never reaps the
    # browser processes Playwright leaves behind; over days they pile up until
    # Playwright's driver cannot start ("'PlaywrightContextManager' object has
    # no attribute '_playwright'"). Playwright's Docker guide requires this.
    init: true
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - taiq-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  taiq-data:
